<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shreshth weds Disha — Title Page (6in × 6in)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Pinyon+Script&family=Mukta:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --maroon: #5a1626;
      --gold: #c9a23f;
      --gold-light: #e7cd86;
      --ivory: #fbf6ec;
      --ivory-2: #f3ead9;
      --serif: "Cormorant Garamond", Georgia, serif;
      --display: "Marcellus", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: "Mukta", system-ui, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @page { size: 6in 6in; margin: 0; }

    .page {
      width: 6in;
      height: 6in;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 120% at 50% 0%, rgba(122, 31, 51, 0.45), transparent 60%),
        linear-gradient(160deg, #4a1020 0%, #5a1626 45%, #7a1f33 100%);
      color: var(--ivory);
    }

    .frame {
      position: absolute;
      inset: 0.28in;
      border: 1.4px solid rgba(201, 162, 63, 0.75);
      border-radius: 2px;
      pointer-events: none;
    }
    .frame::after {
      content: "";
      position: absolute;
      inset: 0.06in;
      border: 0.6px solid rgba(201, 162, 63, 0.4);
      border-radius: 1px;
    }

    .content {
      position: absolute;
      inset: 0.5in;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.34em;
      font-size: 7.5pt;
      color: var(--gold-light);
      margin-bottom: 0.12in;
    }
    .art {
      width: 3in;
      max-width: 100%;
      max-height: 3in;
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 0.08in 0.22in rgba(201, 162, 63, 0.25));
    }
    .date {
      margin-top: 0.16in;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 7.5pt;
      color: var(--ivory);
    }
    .date strong {
      display: block;
      font-family: var(--display);
      font-size: 15pt;
      letter-spacing: 0.16em;
      color: var(--gold-light);
      padding: 0.08in 0;
      margin: 0.1in auto;
      border-top: 1px solid rgba(201, 162, 63, 0.5);
      border-bottom: 1px solid rgba(201, 162, 63, 0.5);
      width: 3in;
    }
    .venue {
      font-family: var(--serif);
      font-style: italic;
      font-size: 10pt;
      color: var(--ivory-2);
      margin-top: 0.06in;
      line-height: 1.35;
    }

    .toolbar { position: fixed; top: 12px; right: 12px; z-index: 50; }
    .toolbar button {
      font-family: "Mukta", sans-serif;
      font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      font-size: 11px; padding: 10px 18px; border: none; border-radius: 4px;
      background: var(--maroon); color: var(--gold-light); cursor: pointer;
      box-shadow: 0 6px 18px -8px rgba(0,0,0,0.5);
    }
    @media screen {
      body { background: #2c2c2c; padding: 24px; display: flex; justify-content: center; }
      .page { box-shadow: 0 12px 50px rgba(0,0,0,0.55); }
    }
    @media print {
      .toolbar { display: none; }
      body { background: none; padding: 0; }
      .page { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">Print / Save PDF</button></div>

  <section class="page">
    <div class="frame"></div>
    <div class="content">
      <p class="kicker">Wedding Invitation</p>
      <img class="art" src="assets/ganesha-calligraphy.png" alt="Shreshth weds Disha" />
      <div class="date">
        A celebration from
        <strong>2 &ndash; 6 July 2026</strong>
      </div>
      <p class="venue">WelcomHotel by ITC Hotels,<br>Dwarka, New Delhi</p>
    </div>
  </section>
</body>
</html>
